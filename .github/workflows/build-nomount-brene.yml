name: Build SM8850 (Latest BakaSU + SuSFS v2.4.0 + BRENE + NoMount + Manager APK)

on:
  workflow_dispatch:

env:
  KBUILD_BUILD_USER: "XtinctionKernel"
  KBUILD_BUILD_HOST: "bakasu"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget zip unzip tar xz-utils bc bison flex \
            build-essential libssl-dev libelf-dev libdw-dev dwarves python3 \
            ccache rsync jq cpio kmod cargo rustc clang lld llvm

      - name: Checkout android_kernel_xiaomi_sm8850 (bakasu)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          fetch-depth: 1
          path: kernel_prep

      - name: Clone CI Center & Upgrade to SuSFS v2.4.0 + NoMount + XtinctionKernel@bakasu
        run: |
          git clone --depth=1 https://github.com/YuzakiKokuban/Kokuban_Kernel_CI_Center.git ci_center

          # 1. Fetch latest SuSFS v2.4.0 commit from simonpunk/susfs4ksu (gki-android16-6.12)
          git clone -b gki-android16-6.12 https://gitlab.com/simonpunk/susfs4ksu.git susfs_latest
          cd susfs_latest
          SUSFS_V24_SHA=$(git rev-parse HEAD)
          echo "Upgrading SuSFS from c6788e2 to latest v2.4.0 commit: ${SUSFS_V24_SHA}"
          cd ..

          # 2. Update pinned SuSFS revision in ci_center to latest v2.4.0 SHA & set XtinctionKernel version strings
          find ci_center -type f \( -name "*.json" -o -name "*.rs" -o -name "*.toml" -o -name "*.sh" \) -exec sed -i \
            -e "s/c6788e2a21dc717beb7dd3a36b729b58bc909927/${SUSFS_V24_SHA}/g" \
            -e 's/Kokuban-SilverWolf-BakaSU/XtinctionKernel@bakasu/g' \
            -e 's/-BakaSU/@bakasu/g' \
            -e 's/Kokuban-SilverWolf/XtinctionKernel/g' \
            -e 's/KokubanKernel@BakaSU/XtinctionKernel@BakaSU/g' \
            -e 's/KokubanKernel/XtinctionKernel/g' \
            -e 's/--dirty//g' \
            -e 's/-dirty//g' {} + || true

          # 3. Update mi17_sm8850.patch IN-PLACE for SuSFS v2.4.0 (splitting by '^--- a/' so all 27 files are kept)
          python3 - << 'PYEOF'
          import re, subprocess

          old_sha = "c6788e2a21dc717beb7dd3a36b729b58bc909927"
          patch_rel = "kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"

          old_p = subprocess.check_output(["git", "-C", "susfs_latest", "show", f"{old_sha}:{patch_rel}"], text=True, errors="replace")
          new_p = subprocess.check_output(["git", "-C", "susfs_latest", "show", f"HEAD:{patch_rel}"], text=True, errors="replace")

          def parse_uni_blocks(text):
              cleaned = []
              for line in text.splitlines(keepends=True):
                  if line.startswith("diff --git ") or re.match(r"^index [0-9a-f]+\.\.[0-9a-f]+", line):
                      continue
                  cleaned.append(line)
              full = "".join(cleaned)
              parts = re.split(r"(?=^--- a/)", full, flags=re.MULTILINE)
              blocks = []
              for part in parts:
                  if not part.strip():
                      continue
                  m = re.match(r"^--- a/([^\t\r\n]+)", part)
                  if m:
                      fname = m.group(1).strip()
                      if not part.endswith("\n"):
                          part += "\n"
                      blocks.append([fname, part])
              return blocks

          old_map = dict(parse_uni_blocks(old_p))
          new_map = dict(parse_uni_blocks(new_p))

          with open("ci_center/configs/susfs/mi17_sm8850.patch", "r", encoding="utf-8", errors="replace") as f:
              mi17_text = f.read()

          mi17_blocks = parse_uni_blocks(mi17_text)
          print(f"Parsed {len(mi17_blocks)} file blocks from mi17_sm8850.patch")
          assert len(mi17_blocks) >= 25, f"Expected >=25 blocks, got {len(mi17_blocks)}"

          # Apply ONLY the SuSFS fs/Makefile block to kernel_prep now, and remove it from mi17_blocks
          # so git diff at the end emits a single combined (SuSFS + NoMount) diff for fs/Makefile
          kept_blocks = []
          for fname, block in mi17_blocks:
              if fname == "fs/Makefile":
                  subprocess.run(["patch", "-d", "kernel_prep", "-p1", "--forward"], input=block.encode(), check=True)
                  print("Applied SuSFS fs/Makefile hunk to kernel_prep for unified diff")
                  continue
              if fname in new_map and old_map.get(fname) != new_map[fname]:
                  res = subprocess.run(["patch", "-d", "kernel_prep", "-p1", "--dry-run", "--forward"], input=new_map[fname].encode(), capture_output=True)
                  if res.returncode == 0:
                      print(f"Upgraded {fname} in-place in mi17_sm8850.patch to SuSFS v2.4.0")
                      block = new_map[fname]
              kept_blocks.append([fname, block])

          with open("ci_center/configs/susfs/mi17_sm8850.patch", "w", encoding="utf-8") as f:
              f.write("".join(b[1] for b in kept_blocks))
          PYEOF
          rm -rf susfs_latest

          cd kernel_prep
          # 4. Integrate NoMount on top of the SuSFS-patched fs/Makefile
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash
          rm -f fs/nomount
          cp -r NoMount/kernel/src fs/nomount
          rm -rf NoMount

          # 5. Declare KSU_SUSFS_PRIORITY_UID_FILTER in Kconfig so Kbuild never drops it during make gki_defconfig
          cat << 'EOF' >> fs/nomount/Kconfig

          config KSU_SUSFS_PRIORITY_UID_FILTER
          	bool "SUSFS Priority UID Filter (v2.4.0+)"
          	default y
          EOF

          # 6. Hook arch/arm64/Makefile to enable KSU_SUSFS_PRIORITY_UID_FILTER in KernelSU & strip -dirty / KokubanKernel
          cat << 'EOF' >> arch/arm64/Makefile

          # Sync BakaSU with SuSFS v2.4.0 Priority UID Filter and clean version strings
          _SYNC_BAKASU_V24 := $(shell if [ -d "$(srctree)/KernelSU" ] && [ ! -f "$(srctree)/KernelSU/.v24_synced" ]; then \
            find "$(srctree)/KernelSU" -maxdepth 3 -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i \
              -e 's/--dirty//g' \
              -e 's/-dirty//g' \
              -e 's/KokubanKernel/XtinctionKernel/g' {} + 2>/dev/null || true; \
            for mk in "$(srctree)/KernelSU/kernel/Makefile" "$(srctree)/KernelSU/kernel/Kbuild"; do \
              if [ -f "$$mk" ]; then \
                printf '\nccflags-y += -DCONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=1\n' >> "$$mk"; \
              fi; \
            done; \
            touch "$(srctree)/KernelSU/.v24_synced"; \
          fi)
          EOF

          echo "ccflags-y += -Wno-error" >> fs/nomount/Makefile

          # 7. Append NoMount and all SuSFS v2.4.0 flags for BRENE (10/10) to gki_defconfig
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_NOMOUNT=y
          EOF

          # 8. Stage ONLY the new/combined files and append to mi17_sm8850.patch, then verify 0 duplicate files exist
          git add fs arch/arm64/Makefile arch/arm64/configs/gki_defconfig
          echo "" >> ../ci_center/configs/susfs/mi17_sm8850.patch
          git diff --cached HEAD >> ../ci_center/configs/susfs/mi17_sm8850.patch
          cd ..
          rm -rf kernel_prep

          python3 - << 'PYEOF'
          import re
          with open("ci_center/configs/susfs/mi17_sm8850.patch", "r", encoding="utf-8") as f:
              files = [m.group(1).strip() for m in re.finditer(r"^--- a/([^\t\r\n]+)", f.read(), flags=re.MULTILINE)]
          dups = [x for x in set(files) if files.count(x) > 1]
          print(f"Verified {len(files)} file blocks in mi17_sm8850.patch ({len(dups)} duplicates)")
          assert not dups, f"Duplicate files in patch: {dups}"
          PYEOF

      - name: Build Kernel via Kokuban CI Center
        working-directory: ci_center
        run: |
          chmod +x ./kokuban
          ./kokuban build mi17_sm8850 bakasu bakasu \
            --with-susfs \
            --no-hybridmount \
            --local-root "$GITHUB_WORKSPACE/kokuban-work"

      - name: Collect Kernel ZIP & Matching BakaSU Manager APK (arm64-v8a)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact_out"
          KSU_DIR=$(find "$GITHUB_WORKSPACE/kokuban-work" -type d -name "KernelSU" | head -n 1)
          if [ -n "$KSU_DIR" ] && [ -d "$KSU_DIR/.git" ]; then
            cd "$KSU_DIR"
            COUNT=$(git rev-list --count HEAD)
            KSU_VER=$((30000 + COUNT))
            echo "Compiled with BakaSU version code: $KSU_VER"
          else
            KSU_VER="latest"
          fi

          # 1. Copy compiled AnyKernel3 ZIP with the BakaSU version number in the filename
          find "$GITHUB_WORKSPACE/kokuban-work/artifacts" -type f -name "*.zip" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifact_out/XtinctionKernel-BakaSU-${KSU_VER}-SuSFS-v2.4.0-NoMount.zip" \;

          # 2. Fetch the matching arm64-v8a BakaSU Manager APK from nightly.link (with GitHub Releases fallback)
          mkdir -p /tmp/bakasu_apk
          if curl -fLSs "https://nightly.link/Baka-SU/BakaSU/workflows/build-manager/main/Manager-release.zip" -o /tmp/bakasu_apk/Manager-release.zip; then
            unzip -o /tmp/bakasu_apk/Manager-release.zip -d /tmp/bakasu_apk/
            APK_FILE=$(find /tmp/bakasu_apk -type f \( -iname "*arm64*" -o -iname "*aarch64*" \) -name "*.apk" | head -n 1)
            [ -z "$APK_FILE" ] && APK_FILE=$(find /tmp/bakasu_apk -type f -name "*.apk" ! -iname "*armeabi*" ! -iname "*v7a*" ! -iname "*x86*" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp -v "$APK_FILE" "$GITHUB_WORKSPACE/artifact_out/BakaSU-Manager-${KSU_VER}-arm64-v8a.apk"
            fi
          else
            APK_URL=$(curl -s https://api.github.com/repos/Baka-SU/BakaSU/releases | jq -r '.[0].assets[] | select((.name | endswith(".apk")) and (.name | test("arm64|aarch64"; "i"))) | .browser_download_url' | head -n 1)
            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              curl -LSs "$APK_URL" -o "$GITHUB_WORKSPACE/artifact_out/BakaSU-Manager-${KSU_VER}-arm64-v8a.apk"
            fi
          fi

          ls -lh "$GITHUB_WORKSPACE/artifact_out"

      - name: Upload Kernel ZIP & BakaSU Manager Bundle
        uses: actions/upload-artifact@v4
        with:
          name: XtinctionKernel-BakaSU-Bundle
          path: |
            artifact_out/*.zip
            artifact_out/*.apk

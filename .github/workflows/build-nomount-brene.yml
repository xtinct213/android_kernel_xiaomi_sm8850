- name: Collect Kernel ZIP & Matching BakaSU Manager APK (arm64-v8a)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact_out"
          KSU_DIR=$(find "$GITHUB_WORKSPACE/kokuban-work" -type d -name "KernelSU" | head -n 1)
          if [ -n "$KSU_DIR" ] && [ -d "$KSU_DIR/.git" ]; then
            cd "$KSU_DIR"
            COUNT=$(git rev-list --count HEAD)
            KSU_VER=$((30000 + COUNT))
            echo "Compiled with latest BakaSU version code: $KSU_VER"
          else
            KSU_VER="latest"
          fi

          # 1. Copy compiled AnyKernel3 ZIP with the exact BakaSU version number in the filename
          find "$GITHUB_WORKSPACE/kokuban-work/artifacts" -type f -name "*.zip" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifact_out/XtinctionKernel-BakaSU-${KSU_VER}-SuSFS-NoMount.zip" \;

          # 2. Fetch the matching latest arm64-v8a BakaSU Manager APK from nightly.link (with GitHub Releases fallback)
          mkdir -p /tmp/bakasu_apk
          if curl -fLSs "https://nightly.link/Baka-SU/BakaSU/workflows/build-manager/main/Manager-release.zip" -o /tmp/bakasu_apk/Manager-release.zip; then
            unzip -o /tmp/bakasu_apk/Manager-release.zip -d /tmp/bakasu_apk/
            # Specifically match arm64-v8a / aarch64 first, falling back to universal if single-APK
            APK_FILE=$(find /tmp/bakasu_apk -type f \( -iname "*arm64*" -o -iname "*aarch64*" \) -name "*.apk" | head -n 1)
            [ -z "$APK_FILE" ] && APK_FILE=$(find /tmp/bakasu_apk -type f -name "*.apk" ! -iname "*armeabi*" ! -iname "*v7a*" ! -iname "*x86*" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp -v "$APK_FILE" "$GITHUB_WORKSPACE/artifact_out/BakaSU-Manager-${KSU_VER}-arm64-v8a.apk"
            fi
          else
            APK_URL=$(curl -s https://api.github.com/repos/Baka-SU/BakaSU/releases | jq -r '.[0].assets[] | select((.name | endswith(".apk")) and (.name | test("arm64|aarch64"; "i"))) | .browser_download_url' | head -n 1)
            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              curl -LSs "$APK_URL" -o "$GITHUB_WORKSPACE/artifact_out/BakaSU-Manager-${KSU_VER}-arm64-v8a.apk"
            fi
          fi

          ls -lh "$GITHUB_WORKSPACE/artifact_out"

name: Build SM8850 (BakaSU + SuSFS for BRENE + NoMount)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget zip unzip tar xz-utils bc bison flex \
            build-essential libssl-dev libelf-dev dwarves python3 \
            ccache rsync jq cpio kmod cargo rustc clang lld llvm

      - name: Checkout android_kernel_xiaomi_sm8850 (bakasu)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          fetch-depth: 1
          path: kernel_prep

      - name: Clone Kokuban_Kernel_CI_Center & Inject NoMount + BRENE Flags
        run: |
          git clone --depth=1 https://github.com/YuzakiKokuban/Kokuban_Kernel_CI_Center.git ci_center

          # 1. Apply the existing mi17_sm8850 SuSFS patch into our staging tree first
          cd kernel_prep
          patch -p1 < ../ci_center/configs/susfs/mi17_sm8850.patch

          # 2. Run NoMount's official kernel integration script (adds fs/nomount, fs/Kconfig, fs/Makefile)
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash

          # 3. Append NoMount and all 10 SuSFS flags for BRENE to gki_defconfig
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_NOMOUNT=y
          EOF

          # 4. Export the unified (SuSFS + NoMount + BRENE defconfig) patch back into CI Center
          git add -A
          git diff --cached > ../ci_center/configs/susfs/mi17_sm8850.patch
          cd ..
          rm -rf kernel_prep

      - name: Build Kernel via Kokuban CI Center (SuSFS ON, Hybrid Mount OFF)
        working-directory: ci_center
        run: |
          chmod +x ./kokuban
          ./kokuban build mi17_sm8850 bakasu bakasu \
            --with-susfs \
            --no-hybridmount \
            --local-root "$GITHUB_WORKSPACE/kokuban-work"

      - name: Collect Flashable AnyKernel3 ZIP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact_out"
          find "$GITHUB_WORKSPACE" -type f -name "*.zip" \
            -not -path "*/toolchains/*" \
            -not -path "*/toolchain/*" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifact_out/" \;
          ls -lh "$GITHUB_WORKSPACE/artifact_out"

      - name: Upload Compiled Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi17-Kokuban-BakaSU-SuSFS-NoMount
          path: artifact_out/*.zip

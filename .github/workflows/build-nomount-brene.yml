name: Build SM8850 (Latest BakaSU + SuSFS for BRENE + NoMount)

on:
  workflow_dispatch:

env:
  KBUILD_BUILD_USER: "XtinctionKernel"
  KBUILD_BUILD_HOST: "bakasu"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget zip unzip tar xz-utils bc bison flex \
            build-essential libssl-dev libelf-dev libdw-dev dwarves python3 \
            ccache rsync jq cpio kmod cargo rustc clang lld llvm

      - name: Checkout android_kernel_xiaomi_sm8850 (bakasu)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          fetch-depth: 1
          path: kernel_prep

      - name: Clone Kokuban_Kernel_CI_Center & Configure Dynamic Latest BakaSU + XtinctionKernel@bakasu
        run: |
          git clone --depth=1 https://github.com/YuzakiKokuban/Kokuban_Kernel_CI_Center.git ci_center

          # 1. Preserve our custom LOCALVERSION in kokuban_ci_core
          sed -i 's/LOCALVERSION=/KBUILD_BUILD_USER=XtinctionKernel/g' ci_center/ci_core_rs/src/*.rs || true

          cd kernel_prep
          # 2. Stage fs/Makefile with SuSFS applied so our patch has exact context
          patch -p1 --forward < ../ci_center/configs/susfs/mi17_sm8850.patch || true
          cp fs/Makefile /tmp/Makefile.susfs
          git reset --hard HEAD
          git clean -fd
          cp /tmp/Makefile.susfs fs/Makefile
          git config user.email "builder@localhost"
          git config user.name "Builder"
          git commit -am "base: fs/Makefile after susfs"

          # 3. Force kernel version string (uname -r) to end with -XtinctionKernel@bakasu
          if [ -f "scripts/setlocalversion" ]; then
            sed -i 's/echo "\$res"/echo "\${res}-XtinctionKernel@bakasu"/g' scripts/setlocalversion || true
          fi

          # 4. Integrate NoMount and hook KernelSU Makefile to pull latest BakaSU main + stamp XtinctionKernel@bakasu
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash
          rm -f fs/nomount
          cp -r NoMount/kernel/src fs/nomount
          rm -rf NoMount

          cat << 'EOF' >> fs/nomount/Makefile
          ccflags-y += -Wno-error
          # Ensure KernelSU is on latest origin/main with full history so KSU_VERSION commit count is exact,
          # then append XtinctionKernel@bakasu while keeping the dynamic $(KSU_VERSION) number intact
          _BAKASU_LATEST := $(shell if [ -d "$(srctree)/KernelSU" ]; then \
            cd "$(srctree)/KernelSU" && \
            git fetch --unshallow origin main >/dev/null 2>&1 || git fetch origin main >/dev/null 2>&1; \
            git checkout -f FETCH_HEAD >/dev/null 2>&1 || true; \
            grep -q "XtinctionKernel@bakasu" kernel/Makefile || \
            printf '\nKSU_VERSION_FULL := v4.2.0-$$(KSU_VERSION)-XtinctionKernel@bakasu\nccflags-y += -UKSU_VERSION_FULL -DKSU_VERSION_FULL=\\"$$(KSU_VERSION_FULL)\\"\n' >> kernel/Makefile; \
          fi)
          EOF

          # 5. Append NoMount, LOCALVERSION, and all 10 SuSFS flags for BRENE to gki_defconfig
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_LOCALVERSION="-XtinctionKernel@bakasu"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_NOMOUNT=y
          EOF

          # 6. Append our patch to mi17_sm8850.patch
          git add -A
          echo "" >> ../ci_center/configs/susfs/mi17_sm8850.patch
          git diff --cached HEAD >> ../ci_center/configs/susfs/mi17_sm8850.patch
          cd ..
          rm -rf kernel_prep

      - name: Build Kernel via Kokuban CI Center
        working-directory: ci_center
        run: |
          chmod +x ./kokuban
          ./kokuban build mi17_sm8850 bakasu bakasu \
            --with-susfs \
            --no-hybridmount \
            --local-root "$GITHUB_WORKSPACE/kokuban-work"

      - name: Collect Flashable AnyKernel3 ZIP with Matching BakaSU Version Number
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact_out"
          KSU_DIR=$(find "$GITHUB_WORKSPACE/kokuban-work" -type d -name "KernelSU" | head -n 1)
          if [ -n "$KSU_DIR" ] && [ -d "$KSU_DIR/.git" ]; then
            cd "$KSU_DIR"
            # Calculate the exact KSU_VERSION formula used by KernelSU/BakaSU
            COUNT=$(git rev-list --count HEAD)
            KSU_VER=$((30000 + COUNT))
            echo "Compiled with latest BakaSU version code: $KSU_VER"
          else
            KSU_VER="latest"
          fi
          find "$GITHUB_WORKSPACE/kokuban-work/artifacts" -type f -name "*.zip" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifact_out/XtinctionKernel-BakaSU-${KSU_VER}-SuSFS-NoMount.zip" \;
          ls -lh "$GITHUB_WORKSPACE/artifact_out"

      - name: Upload Compiled Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtinctionKernel-BakaSU-Latest-SuSFS-NoMount
          path: artifact_out/*.zip

name: Build SM8850 (BakaSU + SuSFS for BRENE + NoMount)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget zip unzip tar xz-utils bc bison flex \
            build-essential libssl-dev libelf-dev dwarves python3 \
            ccache rsync jq cpio kmod cargo rustc clang lld llvm

      - name: Checkout android_kernel_xiaomi_sm8850 (Full History)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          fetch-depth: 0
          path: kernel_prep

      - name: Clone Kokuban_Kernel_CI_Center & Inject NoMount + BRENE Flags
        run: |
          git clone --depth=1 https://github.com/YuzakiKokuban/Kokuban_Kernel_CI_Center.git ci_center

          cd kernel_prep
          git fetch origin main:refs/remotes/origin/main || true

          # 1. Reconcile and apply mi17_sm8850.patch using exact git history blobs for conflicting hook files
          python3 - << 'PYEOF'
          import re, subprocess, os

          with open("../ci_center/configs/susfs/mi17_sm8850.patch", "r", encoding="utf-8", errors="replace") as f:
              patch_text = f.read()

          file_diffs = re.split(r'(?=^diff --git )', patch_text, flags=re.MULTILINE)

          for d in file_diffs:
              if not d.strip():
                  continue
              m_file = re.search(r'^diff --git a/(.*?) b/(.*?)$', d, re.MULTILINE)
              if not m_file:
                  continue
              filepath = m_file.group(1).strip()

              # Try direct clean apply first
              p = subprocess.run(["patch", "-p1", "--dry-run", "--forward"], input=d.encode(), capture_output=True)
              if p.returncode == 0:
                  subprocess.run(["patch", "-p1", "--forward"], input=d.encode(), check=True)
                  continue

              # Try exact pre-patch blob SHA from 'index <old_sha>..'
              applied = False
              m_idx = re.search(r'^index ([0-9a-f]+)\.\.', d, re.MULTILINE)
              if m_idx and os.path.exists(filepath):
                  old_sha = m_idx.group(1)
                  if subprocess.run(["git", "cat-file", "-e", old_sha], capture_output=True).returncode == 0:
                      blob = subprocess.check_output(["git", "cat-file", "blob", old_sha])
                      with open(filepath, "wb") as out_f:
                          out_f.write(blob)
                      if subprocess.run(["patch", "-p1", "--dry-run", "--forward"], input=d.encode(), capture_output=True).returncode == 0:
                          subprocess.run(["patch", "-p1", "--forward"], input=d.encode(), check=True)
                          applied = True
                          print(f"Applied {filepath} cleanly via exact blob {old_sha}")

              # Search git commit history across bakasu and main for matching base file
              if not applied and os.path.exists(filepath):
                  revs = subprocess.check_output(["git", "rev-list", "--all", "--", filepath], text=True).splitlines()
                  for rev in revs:
                      blob = subprocess.check_output(["git", "show", f"{rev}:{filepath}"])
                      with open(filepath, "wb") as out_f:
                          out_f.write(blob)
                      if subprocess.run(["patch", "-p1", "--dry-run", "--forward"], input=d.encode(), capture_output=True).returncode == 0:
                          subprocess.run(["patch", "-p1", "--forward"], input=d.encode(), check=True)
                          applied = True
                          print(f"Applied {filepath} cleanly via historical commit {rev}")
                          break

              # Fallback: restore HEAD, apply non-conflicting hunks, and clean up .rej/.orig
              if not applied:
                  subprocess.run(["git", "checkout", "HEAD", "--", filepath], capture_output=True)
                  subprocess.run(["patch", "-p1", "--forward"], input=d.encode())
                  for ext in [".rej", ".orig"]:
                      if os.path.exists(filepath + ext):
                          os.remove(filepath + ext)
                  print(f"Applied {filepath} with existing BakaSU hook preserved")
          PYEOF

          # 2. Run NoMount's official kernel integration script
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash

          # 3. Append NoMount and all 10 SuSFS flags for BRENE to gki_defconfig
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_NOMOUNT=y
          EOF

          # 4. Clean any untracked .rej/.orig files and export clean patch relative to bakasu HEAD
          find . \( -name "*.rej" -o -name "*.orig" \) -delete
          git add -A
          git diff --cached HEAD > ../ci_center/configs/susfs/mi17_sm8850.patch
          cd ..
          rm -rf kernel_prep

      - name: Build Kernel via Kokuban CI Center (SuSFS ON, Hybrid Mount OFF)
        working-directory: ci_center
        run: |
          chmod +x ./kokuban
          ./kokuban build mi17_sm8850 bakasu bakasu \
            --with-susfs \
            --no-hybridmount \
            --local-root "$GITHUB_WORKSPACE/kokuban-work"

      - name: Collect Flashable AnyKernel3 ZIP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact_out"
          find "$GITHUB_WORKSPACE" -type f -name "*.zip" \
            -not -path "*/toolchains/*" \
            -not -path "*/toolchain/*" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifact_out/" \;
          ls -lh "$GITHUB_WORKSPACE/artifact_out"

      - name: Upload Compiled Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi17-Kokuban-BakaSU-SuSFS-NoMount
          path: artifact_out/*.zip
